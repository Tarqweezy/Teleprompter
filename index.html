<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<meta name="theme-color" content="#000000">
<title>Teleprompter</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --glass:rgba(20,20,20,.5);
    --red:#E53935;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;overflow:hidden;background:#000;color:#fff;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif}

  #app{position:fixed;inset:0;background:#000;overflow:hidden}

  /* What you see is what gets recorded: the canvas is the recorded frame. */
  #view{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  /* Hidden source for the camera feed */
  #src{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

  /* Teleprompter text is on screen only. It is not drawn into the recording. */
  #prompt{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 70px);height:34%;overflow:hidden;z-index:2;pointer-events:none;
    -webkit-mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);
            mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
  #scroll{position:absolute;top:0;left:0;right:0;padding:0 8vw;font-size:clamp(22px,6.4vw,30px);line-height:1.38;font-weight:700;
    text-align:center;white-space:pre-wrap;text-shadow:0 2px 8px rgba(0,0,0,.85);will-change:transform}

  .top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(var(--safe-t) + 12px) 14px 0;z-index:4}
  .pill{height:44px;border:0;border-radius:999px;background:var(--glass);color:#fff;padding:0 16px;font-size:15px;font-weight:700;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  #timer{min-width:86px;justify-content:center;font-variant-numeric:tabular-nums;pointer-events:none}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--red);opacity:0}
  #timer.live #dot{opacity:1;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}

  .bottom{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;align-items:center;
    padding:0 0 calc(var(--safe-b) + 24px);background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 34px}
  .round{width:52px;height:52px;border-radius:50%;border:0;background:var(--glass);color:#fff;display:grid;place-items:center;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;padding:0}
  .round svg{width:22px;height:22px}

  #shutter{position:relative;width:84px;height:84px;border:0;padding:0;background:transparent;cursor:pointer}
  #ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  #ring circle{fill:none;stroke-width:5}
  #ring .track{stroke:rgba(255,255,255,.35)}
  #ring .prog{stroke:var(--red);stroke-linecap:round}
  #core{position:absolute;inset:12px;border-radius:50%;background:#fff;transition:all .22s cubic-bezier(.3,.7,.4,1)}
  #shutter.live #core{inset:27px;border-radius:9px;background:var(--red)}

  /* Sheets */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#141414;border-radius:22px 22px 0 0;
    padding:12px 18px calc(var(--safe-b) + 18px);transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .sheet.open{transform:translateY(0)}
  .grip{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 14px}
  .sheet h2{font-size:17px;font-weight:700;margin-bottom:12px}
  #scriptInput{width:100%;height:42vh;background:#262626;color:#fff;border:0;border-radius:14px;padding:14px;
    font:600 17px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;resize:none;outline:none}
  .sheet-row{display:flex;gap:10px;margin-top:12px}
  .btn{flex:1;height:50px;border:0;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
  .btn-light{background:#fff;color:#000}
  .btn-dark{background:#262626;color:#fff}
  #speedValue{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0 14px}
  #speed{width:100%;height:44px;accent-color:#fff}
  .slow-fast{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.6);margin-top:6px}

  /* Review after recording */
  #review{position:absolute;inset:0;z-index:8;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  #review.show{display:flex}
  #preview{width:min(74vw,320px);aspect-ratio:9/16;object-fit:contain;border-radius:16px;background:#111}
  #reviewMsg{font-size:14px;color:rgba(255,255,255,.7);min-height:20px}
  .big{height:52px;min-width:220px;padding:0 22px;border-radius:12px;font-size:16px;font-weight:700;border:none;cursor:pointer}
  .big-light{background:#fff;color:#000}
  .big-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
</style>
</head>
<body>
<div id="app">

  <canvas id="view" width="720" height="1280"></canvas>
  <video id="src" autoplay playsinline muted></video>

  <div id="prompt"><div id="scroll"></div></div>

  <div class="top">
    <button class="pill" id="scriptBtn" aria-label="Add or edit script">+ Script</button>
    <div class="pill" id="timer"><span id="dot"></span><span id="time">0:00</span></div>
    <button class="pill" id="speedBtn" aria-label="Scroll speed">Speed <span id="speedNow">50</span></button>
  </div>

  <div class="bottom">
    <div class="row">
      <button class="round" id="resetBtn" aria-label="Restart script">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 108-8M4 4v4h4"/></svg>
      </button>
      <button id="shutter" aria-label="Record">
        <svg id="ring" viewBox="0 0 84 84">
          <circle class="track" cx="42" cy="42" r="38"/>
          <circle class="prog" id="prog" cx="42" cy="42" r="38" stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
        </svg>
        <span id="core"></span>
      </button>
      <button class="round" id="playBtn" aria-label="Play script">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </div>

  <div class="sheet" id="scriptSheet">
    <div class="grip"></div>
    <h2>Script</h2>
    <textarea id="scriptInput" placeholder="Type or paste your script"></textarea>
    <div class="sheet-row">
      <button class="btn btn-dark" id="scriptClear">Clear</button>
      <button class="btn btn-light" id="scriptDone">Done</button>
    </div>
  </div>

  <div class="sheet" id="speedSheet">
    <div class="grip"></div>
    <h2>Scroll speed</h2>
    <div id="speedValue"><span id="speedBig">50</span> px per second</div>
    <input id="speed" type="range" min="10" max="120" step="1" value="50" aria-label="Scroll speed">
    <div class="slow-fast"><span>Slower</span><span>Faster</span></div>
    <div class="sheet-row">
      <button class="btn btn-light" id="speedDone">Done</button>
    </div>
  </div>

  <div id="review">
    <video id="preview" playsinline controls></video>
    <div id="reviewMsg"></div>
    <button class="big big-light" id="saveBtn">Save video</button>
    <button class="big big-ghost" id="retakeBtn">Retake</button>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

const MAX_SECONDS = 60;
const CIRC = 2 * Math.PI * 38;
const W = 720, H = 1280;            // recorded frame: portrait 9:16
const ROTATE_DIR = 1;               // 1 = rotate clockwise. If the picture is upside down, change to -1.

const view = $('view'), ctx = view.getContext('2d'), src = $('src');

let stream = null, running = false;
let scriptText = '', speedVal = 50;
let recorder = null, chunks = [], blob = null, ext = 'webm', mime = '', previewURL = null;
let startT = 0, tickId = null, promptY = 0, promptRunning = false, lastTs = 0;

/* ---------- Camera frame -> portrait canvas ---------- */
function drawFrame() {
  if (!running) return;
  if (src.readyState >= 2 && src.videoWidth) {
    const vw = src.videoWidth, vh = src.videoHeight;
    const rotate = vw > vh;                       // landscape sensor on a portrait phone
    const ew = rotate ? vh : vw, eh = rotate ? vw : vh;
    const s = Math.max(W / ew, H / eh);           // fill the portrait frame, no empty edges
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    if (rotate) ctx.rotate(ROTATE_DIR * Math.PI / 2);
    ctx.scale(s, s);
    ctx.drawImage(src, -vw / 2, -vh / 2, vw, vh);
    ctx.restore();
  }
  requestAnimationFrame(drawFrame);
}

async function startCam() {
  if (stream) return;
  const attempts = [
    { video: { facingMode: 'user' }, audio: true },
    { video: { facingMode: 'user' }, audio: false }
  ];
  let lastErr = null;
  for (const c of attempts) {
    try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
    catch (e) { lastErr = e; }
  }
  if (!stream) {
    showError('Camera is blocked. Allow camera and microphone for this site in your browser settings, then reopen the app. (' + (lastErr ? lastErr.name : 'unknown') + ')');
    return;
  }
  src.srcObject = stream;
  try { await src.play(); } catch (e) {}
  running = true;
  requestAnimationFrame(drawFrame);
}

function showError(msg) {
  $('reviewMsg').textContent = msg;
  $('saveBtn').style.display = 'none';
  $('retakeBtn').textContent = 'OK';
  $('review').classList.add('show');
}

function pickType() {
  if (!window.MediaRecorder) return '';
  const types = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  for (const t of types) if (MediaRecorder.isTypeSupported(t)) return t;
  return '';
}

/* ---------- Teleprompter (on screen only) ---------- */
function setPromptText() {
  $('scroll').textContent = scriptText || 'Tap + Script to add your text.';
  resetPrompt();
}
function resetPrompt() {
  promptY = $('prompt').clientHeight * 0.45;
  $('scroll').style.transform = 'translateY(' + promptY + 'px)';
}
function frame(ts) {
  if (!promptRunning) return;
  const dt = lastTs ? (ts - lastTs) / 1000 : 0;
  lastTs = ts;
  promptY -= speedVal * dt;
  $('scroll').style.transform = 'translateY(' + promptY + 'px)';
  if (promptY < -$('scroll').offsetHeight) { stopPrompt(); return; }
  requestAnimationFrame(frame);
}
function startPrompt() {
  if (promptRunning) return;
  promptRunning = true; lastTs = 0;
  $('playIcon').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  requestAnimationFrame(frame);
}
function stopPrompt() {
  promptRunning = false;
  $('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
}

/* ---------- Recording ---------- */
function tick() {
  const secs = (performance.now() - startT) / 1000;
  const s = Math.floor(secs);
  $('time').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('prog').style.strokeDashoffset = CIRC * (1 - Math.min(secs / MAX_SECONDS, 1));
  if (secs >= MAX_SECONDS) stopRec();
}

function startRec() {
  if (!running || !window.MediaRecorder || !view.captureStream) {
    showError('Recording is not supported in this browser. Use Safari on iPhone.');
    return;
  }
  // Record the portrait canvas, plus the microphone audio.
  const out = view.captureStream(30);
  stream.getAudioTracks().forEach(t => out.addTrack(t));
  mime = pickType();
  chunks = [];
  recorder = new MediaRecorder(out, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = onStopped;
  recorder.start(1000);

  $('shutter').classList.add('live');
  $('timer').classList.add('live');
  startT = performance.now();
  tickId = setInterval(tick, 200);
  resetPrompt();
  startPrompt();
}

function stopRec() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  clearInterval(tickId);
  $('shutter').classList.remove('live');
  $('timer').classList.remove('live');
  stopPrompt();
}

function onStopped() {
  const type = recorder.mimeType || mime || 'video/webm';
  blob = new Blob(chunks, { type });
  ext = type.includes('mp4') ? 'mp4' : 'webm';
  if (previewURL) URL.revokeObjectURL(previewURL);
  previewURL = URL.createObjectURL(blob);
  $('preview').src = previewURL;
  $('reviewMsg').textContent = 'Save to Photos or Files.';
  $('saveBtn').style.display = '';
  $('retakeBtn').textContent = 'Retake';
  $('review').classList.add('show');
}

async function saveVideo() {
  const name = 'teleprompter-' + Date.now() + '.' + ext;
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Teleprompter video' }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = previewURL;
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

function closeReview() {
  $('review').classList.remove('show');
  $('saveBtn').style.display = '';
  $('retakeBtn').textContent = 'Retake';
  $('preview').removeAttribute('src');
  $('preview').load();
  blob = null;
  $('time').textContent = '0:00';
  $('prog').style.strokeDashoffset = CIRC;
  resetPrompt();
}

/* ---------- Sheets ---------- */
function openSheet(id) { $(id).classList.add('open'); }
function closeSheets() { document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')); }

$('scriptBtn').onclick = () => {
  $('scriptInput').value = scriptText;
  openSheet('scriptSheet');
};
$('scriptDone').onclick = () => {
  scriptText = $('scriptInput').value.trim();
  setPromptText();
  closeSheets();
};
$('scriptClear').onclick = () => { $('scriptInput').value = ''; };

$('speedBtn').onclick = () => openSheet('speedSheet');
$('speedDone').onclick = () => closeSheets();
$('speed').oninput = e => {
  speedVal = Number(e.target.value);
  $('speedNow').textContent = speedVal;
  $('speedBig').textContent = speedVal;
};

/* ---------- Controls ---------- */
$('shutter').onclick = () => (recorder && recorder.state === 'recording') ? stopRec() : startRec();
$('playBtn').onclick = () => promptRunning ? stopPrompt() : startPrompt();
$('resetBtn').onclick = () => { stopPrompt(); resetPrompt(); };
$('saveBtn').onclick = saveVideo;
$('retakeBtn').onclick = closeReview;

// Tap the camera area to close any open sheet
$('view').addEventListener('pointerdown', closeSheets);

$('speed').value = speedVal;
$('speedNow').textContent = speedVal;
$('speedBig').textContent = speedVal;
setPromptText();
startCam();
</script>
</body>
</html>
